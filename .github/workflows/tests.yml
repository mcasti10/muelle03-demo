name: Validación técnica y regresión
on:
  pull_request:
    branches: [main, 'feature/revision-edt-xml']
  push:
    branches: ['fix/validacion-importaciones','feature/edt-avance-fisico-sin-costos']
permissions:
  contents: read
jobs:
  imports-and-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
