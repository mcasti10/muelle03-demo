function parseCSV(text,allowTab=false){
  text=text.replace(/^\ufeff/,'');
  const header=text.split(/\r?\n/,1)[0];
  const sep=(header.match(/;/g)||[]).length>(header.match(/,/g)||[]).length?';':allowTab&&header.includes('\t')?'\t':',';

  const endRow=()=>{endCell();if(row.some(v=>v.trim().length))rows.push(row);row=[]};
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(quoted){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else{quoted=false;closed=true}}else cell+=c;continue}
    if(c===sep){endCell();continue}
    if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;endRow();continue}
    if(closed){if(c===' '||c==='\t')continue;throw Error('Caracteres después de comillas de cierre en CSV.');}
    if(c==='"'){if(cell.length)throw Error('Comillas inesperadas en CSV.');quoted=true}else cell+=c;

  endRow();if(rows.length<2)throw Error('El CSV no contiene filas de datos.');return rows;
}

function decimalInput(value){

  if(typeof value!=='string')return NaN;
  const text=value.trim();
  return /^[+-]?(?:\d+(?:[.,]\d+)?|[.,]\d+)$/.test(text)?Number(text.replace(',','.')):NaN;

function loadCSV(text){

  if(!h.includes('id'))throw Error('Falta la columna ID.');
  if(h.filter(x=>names.includes(x)).length!==1)throw Error('Se requiere una única columna avance_real_pct o AVANCE REAL %.');
  if(h.some(x=>['pu_control','pu_control_pen','metrado_aprobado','peso_tecnico'].includes(x)))throw Error('La actualización de avances no puede modificar metrados, coeficientes técnicos ni precios. Usa la plantilla de actualización de avances.');

    if(!byId.has(id))throw Error('ID no registrado en la base: '+id);
    if(staged.has(id))throw Error('ID duplicado: '+id);
